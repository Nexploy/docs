services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexploy-docs:latest
    container_name: nexploy-docs
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3004"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
